<mat-toolbar><!--color="primary"-->
  <mat-toolbar-row class="desktop-header-bar">


    <span class="brand-logo-wrapper">
      <img class="logo-img" src="../assets/images/brand-logo.png" alt="Brand Logo" />
      <span class="page-title">{{title}}</span>
    </span>

    <span class="spacer"></span>
    <!--
  <button mat-button (click)="navigateToHome()">Home</button>
  <button mat-button (click)="navigateToOrdering()">Orders</button>
  <button mat-button (click)="navigateToLogin()">Login</button>
  -->
    <span class="pharmacy-info">
      <span class="label">Pharmacy:</span>
      <span class="data">CAH | Columbus, OH</span>
    </span>
    <span class="line"></span>
    <!-- Only show user info and logout when NOT on login page  *ngIf="!isLoginPage"-->
    <span class="username-div">
      <span class="username">Sam Ford</span>
      <span class="circle-btn"> SF</span>
    </span>
    <span class="line"></span>
    <button mat-icon-button (click)="navigateToLogin()">
      <mat-icon>logout</mat-icon>
    </button>
    <span class="logout-text">Logout</span>
  </mat-toolbar-row>
  <mat-toolbar-row class="mobile-header-bar">
    <span class="brand-logo-wrapper">
      <img class="logo-img" src="../assets/images/CAH-mobile-logo.png" alt="Brand Logo" />
      <span class="brand-name">SMP</span>
      <span class="page-title">{{title}}</span>
    </span>
    <span class="spacer"></span>
    <button mat-icon-button aria-label="menu icon">
      <mat-icon>menu</mat-icon>
    </button>
  </mat-toolbar-row>
</mat-toolbar>






<router-outlet></router-outlet>
